[package]
name = "sydtui"
version = "1.0.0"
edition = "2024"
authors = ["arnaudelrio", "<arnau.delrio@gmail.com>"]
description = "A TUI for managing groups of systemd services"
readme = "README.md"
license-file = "LICENSE"
repository = "https://github.com/arnaudelrio/sydtui"
keywords = ["systemd", "tui", "cli"]

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
ratatui = { version = "0.30.2", features = ["serde"] }
serde = { version = "1.0.229", features = ["rc"] }
serde_json = "1.0.151"
toml = "1.1.3"
